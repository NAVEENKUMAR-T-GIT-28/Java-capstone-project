spring.application.name=smart-clinic-management-system
server.port=${SERVER_PORT:8080}
# Local demo uses H2; use SPRING_PROFILES_ACTIVE=docker for MySQL/Mongo via Compose.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:clinicdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/cms}
clinic.jwt.secret=${CLINIC_JWT_SECRET:clinic-local-demo-signing-key-change-before-deploy-123456}
clinic.jwt.expiration-ms=${CLINIC_JWT_EXPIRATION_MS:3600000}
